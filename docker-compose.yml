services:
  palworld-caretaker:
    build:
      context: .
      dockerfile: Dockerfile
    image: palworld-caretaker:0.9.0
    container_name: palworld-caretaker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      STEAMCMD_UPDATE_ON_START: ${STEAMCMD_UPDATE_ON_START:-true}
      # Exact public browser origins are required for LAN/DNS/proxy access.
      # These environment values override matching caretaker.env values.
      PALWORLD_WEB_PUBLIC_ORIGIN: ${PALWORLD_WEB_PUBLIC_ORIGIN:-}
      PALWORLD_WEB_ALLOWED_ORIGINS: ${PALWORLD_WEB_ALLOWED_ORIGINS:-}
      PALWORLD_WEB_ALLOWED_HOSTS: ${PALWORLD_WEB_ALLOWED_HOSTS:-}
      # Set true only for a disposable local test server using generated
      # placeholder credentials. Production starts fail closed by default.
      PALWORLD_DOCKER_ALLOW_INSECURE_DEFAULTS: ${PALWORLD_DOCKER_ALLOW_INSECURE_DEFAULTS:-false}
    volumes:
      - ./data/server:/srv/palworld
      - ./data/backups:/srv/palworld-backups
      - ./config:/etc/palworld-caretaker
    ports:
      - "8211:8211/udp"
      - "${PALWORLD_REST_BIND_IP:-127.0.0.1}:25575:25575/tcp"
      # Host publication is distinct from the container's internal 0.0.0.0 bind.
      - "${PALWORLD_WEB_PUBLISH_IP:-127.0.0.1}:8765:8765/tcp"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8765/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5m
    stop_grace_period: 3m
