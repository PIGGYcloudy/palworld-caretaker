# Copy this file to docker-compose.yml or use it with:
# docker compose -f docker-compose.example.yml up -d
services:
  palworld-caretaker:
    build: .
    image: palworld-caretaker:0.9.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: 1000
      PGID: 1000
      STEAMCMD_UPDATE_ON_START: "true"
      # Set exact browser origins before publishing beyond localhost.
      PALWORLD_WEB_PUBLIC_ORIGIN: ${PALWORLD_WEB_PUBLIC_ORIGIN:-}
      PALWORLD_WEB_ALLOWED_ORIGINS: ${PALWORLD_WEB_ALLOWED_ORIGINS:-}
      PALWORLD_WEB_ALLOWED_HOSTS: ${PALWORLD_WEB_ALLOWED_HOSTS:-}
      PALWORLD_DOCKER_ALLOW_INSECURE_DEFAULTS: "false"
    volumes:
      - ./data/server:/srv/palworld
      - ./data/backups:/srv/palworld-backups
      - ./config:/etc/palworld-caretaker
    ports:
      - "8211:8211/udp"              # Palworld game traffic
      - "127.0.0.1:25575:25575/tcp"  # optional REST host exposure
      - "${PALWORLD_WEB_PUBLISH_IP:-127.0.0.1}:8765:8765/tcp"  # host-side UI publication
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8765/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5m
    stop_grace_period: 3m
