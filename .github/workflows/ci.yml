name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check Bash syntax
        run: |
          bash -n install-palworld.sh upgrade-palworld-manager.sh scripts/*.sh
          bash -n scripts/palworld-control scripts/palworld-rest-firewall scripts/palworld-discord-configure
      - name: Run ShellCheck
        run: |
          shellcheck install-palworld.sh upgrade-palworld-manager.sh scripts/*.sh
          shellcheck scripts/palworld-control scripts/palworld-rest-firewall scripts/palworld-discord-configure
      - name: Compile Python
        run: python -m py_compile scripts/*.py tests/*.py

  tests:
    name: Unit and workflow integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install workflow test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          pip install "discord.py>=2.3.0,<3"
      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_*.py' -v
